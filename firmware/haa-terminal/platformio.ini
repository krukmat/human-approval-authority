[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
build_flags =
  -DHAA_TERMINAL_POC=1
  -Wall
  -Wextra

; W5 POC deliberately has no Wi-Fi/Bluetooth application path.
; USB transport is introduced in W5-T02; this scaffold only proves the
; target/toolchain and keeps hardware-facing boundaries explicit.
