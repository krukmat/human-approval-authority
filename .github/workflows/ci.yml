name: ci
on: [push, pull_request]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - name: Commit generated lockfile on current main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Stale CI run; not committing lockfile"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(w7): lock npm dependency graph"
          git push origin HEAD:main
      - run: npm run pack:check
      - run: npm test
      - run: npx tsc --noEmit

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t haa-ci .
      - name: Start container
        run: |
          docker run -d --name haa-ci-run -p 127.0.0.1:8787:8787 -e HAA_DEV_BOOTSTRAP=1 haa-ci
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs haa-ci-run
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f haa-ci-run || true

  macos-approver-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: swift test --package-path macos/haa-approver
      - name: Compile app-like approver wrapper
        run: >-
          xcodebuild
          -project macos/haa-approver-app/HAAApprover.xcodeproj
          -target HAAApprover
          -configuration Release
          CODE_SIGNING_ALLOWED=NO
          build
